<article class="project-showcase">
  <div class="wrap">

    <div class="project-showcase-nav">
      <a href="/" class="project-back">← Home</a>
      {% if page.tag %}<span class="project-tag">{{ page.tag }}</span>{% endif %}
    </div>

    <h1 class="project-hero-title">{{ page.title }}</h1>

    {% if page.description %}
    <p class="project-hero-desc">{{ page.description }}</p>
    {% endif %}

    {% if page.link %}
    <a href="{{ page.link }}" class="project-open-btn" target="_blank" rel="noopener noreferrer">
      Open project <span class="arr">→</span>
    </a>
    {% endif %}

    {% if page.content != '' %}
    <div class="project-body">
      {{ page.content }}
    </div>
    {% endif %}

  </div>
</article>
